name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
            frontend:
              - 'client/**'
            

  backend-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
      SECRET: ${{ secrets.SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Node install
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Run linter
        run: cd server && npm run lint

      - name: Run tests
        run: cd server && npm run test

  frontend-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node install
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Run linter
        run: cd client && npm run lint

      - name: Run tests
        run: cd client && npm run test

  e2e-tests:
    needs:
      - detect-changes
      - backend-tests
      - frontend-tests
    if: |
      always() &&
      (needs.detect-changes.outputs.backend == 'true' ||
       needs.detect-changes.outputs.frontend == 'true') &&
      (needs.backend-tests.result == 'success' ||
       needs.backend-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' ||
       needs.frontend-tests.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install E2E dependencies
        run: |
          npm ci
          npm ci --prefix e2e
          npm ci --prefix server
          npm ci --prefix client

      - name: Run build
        run: npm run build

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          NODE_ENV: test
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          SECRET: ${{ secrets.SECRET }}
          PORT: 3003
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    needs: e2e-tests
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.e2e-tests.result == 'success' &&
      !contains(github.event.head_commit.message, '#skip')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK }}"

  notify_error:
    needs: [backend-tests, frontend-tests, e2e-tests, deploy]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: 'ubuntu-latest'
    steps:
        - name: 'Job Notification Failure'
          uses: sarisia/actions-status-discord@v1.16.0
          with:
            webhook: ${{ secrets.DISCORD_WEBHOOK }}
            status: Failure
            content: "Hey ${{ github.actor }}, the deployment pipeline has failed. Please check the logs for more details."
            title: "Deployment failed"
            description: |
              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Commit: ${{ github.sha }}
              Message: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
              Author: ${{ github.event.head_commit.author.name || github.actor }}
              Workflow: ${{ github.workflow }}
          
              View commit [here](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
              View workflow run [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            color: "0xff0000"
            url: "https://github.com/Thom4x/fsopen_ci-cd"

  notify_success:
    needs: deploy
    runs-on: 'ubuntu-latest'
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip')}}
    steps:
      - name: 'Job Notification Success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "New version released"
          description: |
                  Commit: ${{ github.sha }}
                  Message: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
                  Author: ${{ github.event.head_commit.author.name || github.actor }}
          color: 0x0000ff
          url: "https://github.com/Thom4x/blog-app"
  
  

  tag_and_versioning:
    needs: deploy
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '#skip')}}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
  
  
name: CI Optimizado

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
            frontend:
              - 'client/**'


  backend-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    env:
        NODE_ENV: test
        TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
        SECRET: ${{ secrets.SECRET }}
    steps:
        - uses: actions/checkout@v4

        - name: node install
          uses: actions/setup-node@v4
          with:
            node-version: '20' 
            cache: 'npm'
            cache-dependency-path: 'server/package-lock.json'

        - name: install dependencies
          run: cd server && npm ci

        - name: run linter
          run: cd server && npm run lint
        
        - name: run tests
          run: cd server && npm run test


  frontend-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4

        - name: node install
          uses: actions/setup-node@v4
          with:
            node-version: '20' 
            cache: 'npm'
            cache-dependency-path: 'client/package-lock.json'

        - name: install dependencies
          run: cd client && npm ci

        - name: run linter
          run: cd client && npm run lint

        - name: run tests
          run: cd client && npm run test
        

  e2e-tests:
    needs: [detect-changes, backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: |
      always() && 
      (needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true') &&
      (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') &&
      (needs.frontend-tests.result == 'success' || needs.frontend-tests.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Install E2E dependencies
        run: |
          npm ci
          npm ci --prefix e2e
          npm ci --prefix server
          npm ci --prefix client

      - name: run build
        run: npm run build

      - name: Install Playwright Browsers
        run: cd e2e && npx playwright install chromium --with-deps

      - name: run e2e tests
        env:
          NODE_ENV: test
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          SECRET: ${{ secrets.SECRET }}
          PORT: 3003
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
            name: playwright-report
            path: playwright-report/
            retention-days: 30

  deploy:
      needs: [e2e-tests]
      runs-on: 'ubuntu-latest'
      if: |
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.e2e-tests.result == 'success' &&
        !contains(github.event.head_commit.message, '#skip')
        
      steps:
        - name: deploy trigger
          run: curl --fail --silent --show-error "${{ secrets.RENDER_DEPLOY_HOOK }}"
  

  tag_and_versioning:
      needs: 'deploy'
      runs-on: 'ubuntu-latest'
      permissions:
        contents: write
      if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip') && needs.deploy.result == 'success' }}
      
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: '0'
          
        - name: github context
          env:
            GITHUB_CONTEXT: ${{ toJson(github) }}
          run: echo "$GITHUB_CONTEXT"
          
        - name: Bump version and push tag
          uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8  
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
            DEFAULT_BUMP: 'patch'


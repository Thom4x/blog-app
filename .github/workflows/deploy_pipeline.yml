name: 'Deployment pipeline'

on:
    push:
        branches: 
            [main, master]
    pull_request: 
        branches:
            [main, master]    

jobs:
    client_server_test:
        runs-on: 'ubuntu-latest'
        steps:
            - uses: actions/checkout@v4

            - name: node install
              uses: actions/setup-node@v4
              with:
                node-version: '20' 
                cache: 'npm'
            
            - name: install dependencies
              run: npm run install:all

            - name: run linter
              run: npm run lint

            - name: start ambient testing
              run: npm run start:test
              env:
                NODE_ENV: test
                TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
                SECRET: ${{ secrets.SECRET }}

            - name: run tests
              run: npm run test
